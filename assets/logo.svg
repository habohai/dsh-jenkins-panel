<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="dsh-jenkins-panel">
  <defs>
    <linearGradient id="bg" x1="40" y1="18" x2="472" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.52" stop-color="#111D31"/>
      <stop offset="1" stop-color="#182A46"/>
    </linearGradient>
    <linearGradient id="mark" x1="124" y1="118" x2="342" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B5E"/>
      <stop offset="0.48" stop-color="#FFB45C"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(316 118) rotate(135) scale(270)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A63" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF7A63" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#02060D" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="7" y="7" width="498" height="498" rx="110" fill="none" stroke="#8FA8D8" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="330" cy="128" r="270" fill="url(#glow)"/>

  <!-- pipeline track: a J-shaped build path -->
  <path d="M306 124V300c0 62-42 104-101 104-43 0-73-21-84-52"
        fill="none" stroke="#02060D" stroke-opacity="0.35" stroke-width="52" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M306 124V300c0 62-42 104-101 104-43 0-73-21-84-52"
        fill="none" stroke="url(#mark)" stroke-width="42" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- pipeline nodes: queued / running / deployed -->
  <g filter="url(#shadow)">
    <circle cx="306" cy="124" r="23" fill="#0F1929" stroke="#FF6B5E" stroke-width="10"/>
    <circle cx="306" cy="124" r="7" fill="#FFD7D1"/>

    <circle cx="306" cy="246" r="17" fill="#0F1929" stroke="#FFB45C" stroke-width="8"/>
    <circle cx="306" cy="246" r="5.5" fill="#FFE7C2"/>

    <circle cx="124" cy="352" r="23" fill="#0F1929" stroke="#5B8CFF" stroke-width="10"/>
    <circle cx="124" cy="352" r="7" fill="#DCE7FF"/>
  </g>

  <!-- small terminal prompt for the panel side -->
  <g opacity="0.9">
    <path d="M368 176l34 30-34 30" fill="none" stroke="#EAF1FF" stroke-opacity="0.72" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M410 238h26" stroke="#A9C2F2" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
